<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FGX Trading Monitor</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02040a;--bg2:rgba(12,22,40,.82);--bg3:rgba(2,6,14,.55);
  --line:rgba(120,170,230,.16);--line2:rgba(120,170,230,.3);
  --text:#e8eef7;--dim:#8b9bb2;--dimmer:#55657d;
  --blue:#18b4ff;--blue2:#0a7cff;--green:#2ee6a0;--red:#ff5d78;--gold:#e6b84a;--purple:#b48cff;--cyan:#00d0f0;
  --steel:linear-gradient(180deg,#f4f7fb 0%,#c3cfdd 48%,#7f90a6 100%);
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sans:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --wide:'Michroma','Outfit',sans-serif;
  --nav-h:74px;
  /* alias (compatibilidad) */
  --border:var(--line);--text2:var(--dim);--text3:var(--dimmer);--accent:var(--blue);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
body{background:
  radial-gradient(520px 320px at 100% 0,rgba(24,180,255,.17),transparent 70%),
  radial-gradient(420px 320px at 0 100%,rgba(10,124,255,.1),transparent 70%),#02040a;background-attachment:fixed}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;position:relative}
button{font-family:inherit;color:inherit}

/* ===== cabecera ===== */
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line);flex-shrink:0;background:linear-gradient(180deg,rgba(2,6,14,.9),rgba(2,6,14,.4))}
.lw{position:relative;display:inline-block;z-index:0;line-height:0}
.lw::before{content:"";position:absolute;inset:-30% -18%;z-index:-1;background:radial-gradient(closest-side,rgba(24,150,255,.42),rgba(10,90,220,.14) 55%,transparent 75%);animation:breathe 4s ease-in-out infinite}
.lw img{height:54px;width:auto;display:block}
.lw .sh{position:absolute;inset:0;-webkit-mask:url(logo.png) center/100% 100% no-repeat;mask:url(logo.png) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%);background-size:320% 100%;animation:logoshine 6s ease-in-out infinite}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;padding:6px 11px;border-radius:99px;border:1px solid rgba(46,230,160,.35);background:rgba(46,230,160,.07);color:var(--green);cursor:pointer;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor;animation:pl 1.6s infinite}
.live.off{color:var(--red);border-color:rgba(255,93,120,.4);background:rgba(255,93,120,.08)}
.live.cache{color:var(--gold);border-color:rgba(230,184,74,.4);background:rgba(230,184,74,.08)}
.live.load{color:var(--blue);border-color:rgba(24,180,255,.4);background:rgba(24,180,255,.08)}
.ref{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(14,26,46,.8);color:var(--blue);font-size:17px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.ref.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.05)}}
@keyframes logoshine{0%,15%{background-position:140% 0}55%,100%{background-position:-70% 0}}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes tabsweep{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
@keyframes glowp{0%,100%{box-shadow:0 0 14px rgba(24,180,255,.2)}50%{box-shadow:0 0 28px rgba(24,180,255,.55)}}
@keyframes glowg{0%,100%{box-shadow:0 0 14px rgba(46,230,160,.08)}50%{box-shadow:0 0 34px rgba(46,230,160,.3)}}
@keyframes glowr{0%,100%{box-shadow:0 0 14px rgba(255,93,120,.08)}50%{box-shadow:0 0 34px rgba(255,93,120,.28)}}
@keyframes lineflow{0%{background-position:-100% 0}100%{background-position:200% 0}}

/* ===== contenido ===== */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px}
h1.pt{font-family:var(--wide);font-weight:400;font-size:15px;letter-spacing:.14em;text-transform:uppercase;background:var(--steel);-webkit-background-clip:text;background-clip:text;color:transparent;margin:2px 0 12px}
.lbl{font-size:9px;letter-spacing:.22em;color:var(--dimmer);text-transform:uppercase}
.mono{font-family:var(--mono)}
.g,.pos{color:var(--green)}.r,.neg{color:var(--red)}.a,.gold{color:var(--gold)}.b,.blue{color:var(--blue)}.p{color:var(--purple)}.d{color:var(--dim)}

/* tarjetas de cristal */
.card{position:relative;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(14,26,46,.9),rgba(6,12,24,.85));padding:14px;margin-bottom:12px;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(24,180,255,.9),transparent);background-size:60% 100%;background-repeat:no-repeat;animation:lineflow 5s linear infinite}
.card::after{content:"";position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac,#18b4ff) 28%,transparent),transparent 70%);animation:breathe 6s ease-in-out infinite;pointer-events:none}
.card>*{position:relative;z-index:1}
.card.click{cursor:pointer;transition:transform .12s,border-color .2s}
.card.click:active{transform:scale(.985);border-color:var(--line2)}
.hero{border-color:rgba(46,230,160,.4);--ac:#2ee6a0;animation:glowg 4s ease-in-out infinite}
.hero.neg{border-color:rgba(255,93,120,.4);--ac:#ff5d78;animation:glowr 4s ease-in-out infinite}
.hero .big{font-size:34px}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big{font-family:var(--mono);font-weight:600;font-size:26px;letter-spacing:-.02em}
.nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:10px;letter-spacing:.14em;color:var(--dimmer);text-transform:uppercase;margin-bottom:2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.m{border-radius:10px;border:1px solid var(--line);background:var(--bg3);padding:8px 9px;min-width:0}
.m .v{font-family:var(--mono);font-size:13px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.03);white-space:nowrap}
.chip.g{color:var(--green);border-color:rgba(46,230,160,.4);background:rgba(46,230,160,.08)}
.chip.r{color:var(--red);border-color:rgba(255,93,120,.4);background:rgba(255,93,120,.08)}
.chip.a{color:var(--gold);border-color:rgba(230,184,74,.4);background:rgba(230,184,74,.08)}
.chip.b{color:var(--blue);border-color:rgba(24,180,255,.4);background:rgba(24,180,255,.08)}
.chip.p{color:var(--purple);border-color:rgba(180,140,255,.4);background:rgba(180,140,255,.08)}
.sec{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:3px;height:11px;border-radius:2px;background:var(--blue);box-shadow:0 0 8px var(--blue)}

/* pestañas en cápsula */
.seg{display:flex;gap:4px;padding:4px;border-radius:99px;border:1px solid var(--line);background:rgba(9,17,32,.8);margin-bottom:12px}
.seg button{flex:1;text-align:center;font-size:10px;letter-spacing:.12em;padding:9px 4px;border-radius:99px;color:var(--dimmer);text-transform:uppercase;background:none;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.seg button.on{color:#fff;background:linear-gradient(180deg,rgba(24,180,255,.3),rgba(10,124,255,.2));border-color:rgba(24,180,255,.5)}
.back{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.btn{border-radius:10px;border:1px solid var(--line);background:rgba(14,26,46,.8);color:var(--dim);padding:8px 14px;font-size:12px;cursor:pointer}
.btn.pri{width:100%;padding:13px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(180deg,#1ab9ff,#0a7cff);border:0;box-shadow:0 6px 24px rgba(24,180,255,.35);margin-bottom:10px}
.btn.sec2{width:100%;padding:13px;font-size:14px;margin-bottom:10px;color:var(--text)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor}

/* listas */
.rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;border:1px solid var(--line);color:var(--dim);flex-shrink:0}
.rk1{background:radial-gradient(circle at 30% 25%,#fff3c4,#e6b84a 60%,#a97c1c);color:#2a1d00;border:0;font-weight:700;box-shadow:0 0 14px rgba(230,184,74,.5)}
.rk2{background:radial-gradient(circle at 30% 25%,#fff,#c3cfdd 60%,#7f90a6);color:#111;border:0;font-weight:700}
.rk3{background:radial-gradient(circle at 30% 25%,#ffd9b0,#cd7f32 60%,#7c4a14);color:#2a1300;border:0;font-weight:700}
.ea{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ea:last-child{border:0}
.ea .in{flex:1;min-width:0}
.ea .t{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-family:var(--mono);font-weight:700;font-size:15px;color:#18b4ff;background:rgba(24,180,255,.1);border:1px solid rgba(24,180,255,.4);border-radius:8px;padding:2px 9px;white-space:nowrap;display:inline-block;letter-spacing:.02em}
.num.big2{font-size:19px;padding:3px 11px}
.fold{display:flex;align-items:center;gap:8px;padding:10px 6px;font-size:13px;font-weight:600;color:#c3cfdd;cursor:pointer;border-bottom:1px solid var(--line)}.fold .fa{color:var(--blue);width:10px}
.srch{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(9,17,32,.8);color:var(--text);font-size:14px;margin-bottom:10px;font-family:inherit;outline:none}
.lb{position:fixed;inset:0;z-index:99;background:rgba(2,6,14,.97);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}.lb[hidden]{display:none}.lb img{max-width:100%;max-height:100%;transform-origin:center;user-select:none;-webkit-user-drag:none;will-change:transform}.lbx{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid rgba(24,180,255,.5);background:rgba(10,20,36,.85);color:#fff;font-size:20px;cursor:pointer}.lbh{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;font-size:11px;color:#8aa;letter-spacing:.06em;pointer-events:none}img.cap{cursor:zoom-in}
.cap{width:100%;border-radius:10px;display:block;min-height:70px;background:#0a1220}
.chk{width:24px;height:24px;border-radius:8px;border:1.5px solid #2a3b57;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#18b4ff;font-size:15px;margin-top:2px}.chk.on{border-color:#18b4ff;background:rgba(24,180,255,.22)}
.crow .ri{width:116px}.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.crow:first-child{border-top:0}.ss{font-size:10px;color:var(--dimmer);margin-top:2px}.mcb{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(9,17,32,.6)}.pbar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#18b4ff,#2ee6a0)}.cfgc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.cfgc button{font-size:11px;padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer}.cfgc button.on{color:#fff;border-color:rgba(24,180,255,.6);background:rgba(24,180,255,.18)}
.ri{width:84px;padding:8px 8px;border-radius:9px;border:1px solid #2a7fb5;background:rgba(14,58,92,.55);color:#4cc3ff;font-family:var(--mono);font-size:15px;font-weight:700;text-align:right;outline:none}
.rm{background:none;border:0;color:#ff5d78;font-size:18px;padding:6px 2px 6px 6px;cursor:pointer}
.stk{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(180deg,transparent,#02040a 40%)}
.btn.pri:disabled{opacity:.45;box-shadow:none}
.nmS{font-size:10px;color:var(--dim);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eb{display:flex;gap:6px;margin-top:8px}
.btn.sm{padding:6px 10px;font-size:11px;border-radius:9px}.btn.sm:disabled{opacity:.38;cursor:default}
.tag{font-family:var(--mono);font-size:9px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--dim);margin-right:4px;display:inline-block}
.tag.b{color:var(--blue)}.tag.g{color:var(--green)}.tag.r{color:var(--red)}.tag.a{color:var(--gold)}
.fil{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.fil::-webkit-scrollbar{display:none}
.fil button{white-space:nowrap;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:rgba(14,26,46,.7);color:var(--dim);font-size:11px;cursor:pointer}
.fil button.on{border-color:rgba(24,180,255,.55);background:rgba(24,180,255,.15);color:var(--blue)}

/* meses */
.yr{display:flex;justify-content:space-between;padding:6px 10px;margin:8px 0 4px;border-radius:8px;background:rgba(24,180,255,.07);border:1px solid rgba(24,180,255,.18);font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.1em}
.mcells{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mc{border-radius:9px;border:1px solid var(--line);background:var(--bg3);padding:7px 4px;text-align:center}
.mc .ml{font-size:9px;color:var(--dimmer);margin-bottom:2px}.mc .mv{font-size:11px;font-weight:600;font-family:var(--mono)}

/* operaciones */
.op{border-radius:12px;border:1px solid var(--line);background:rgba(10,18,34,.7);padding:10px 12px;margin-bottom:7px}
.op.click{cursor:pointer}
.dn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.dn .dd{font-family:var(--mono);font-size:12px;color:var(--text);text-align:center;flex:1}
.dn button{width:38px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(14,26,46,.8);color:var(--blue);font-size:16px;cursor:pointer}
.dn button:disabled{opacity:.3}

/* barras y anillos */
.bar{height:6px;border-radius:9px;background:rgba(120,170,230,.12);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:9px;position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:lineflow 2.8s linear infinite}
.gauge{width:70px;height:70px;flex:none;position:relative}
.gauge svg{width:70px;height:70px;transform:rotate(-90deg)}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:13px}

/* gráfico */
.ch{position:relative;touch-action:pan-y;user-select:none}
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch .cl{position:absolute;left:0;font-family:var(--mono);font-size:9px;color:var(--dimmer);pointer-events:none}
.ch .cd{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--dimmer);margin-top:3px}
.ch .ct{position:absolute;top:0;right:0;font-family:var(--mono);font-size:10px;color:var(--text);background:rgba(2,6,14,.85);border:1px solid var(--line2);border-radius:8px;padding:3px 8px;pointer-events:none;display:none}

/* estados */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px;gap:14px}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;box-shadow:0 0 18px rgba(24,180,255,.3)}
.loading .lt{font-size:12px;color:var(--dim);font-family:var(--mono)}
.empty{text-align:center;padding:44px 18px}
.empty .ic{font-size:44px;margin-bottom:10px}
.empty .et{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty .es{font-size:12px;line-height:1.5;color:var(--dim);margin-bottom:16px}
.note{border-radius:12px;border:1px solid rgba(230,184,74,.35);background:rgba(230,184,74,.07);color:var(--gold);font-size:11px;padding:9px 12px;margin-bottom:12px;line-height:1.4}
.set{border-radius:14px;border:1px solid var(--line);background:var(--bg2);margin-bottom:12px;overflow:hidden}
.set .st{padding:10px 14px;background:rgba(2,6,14,.5);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--line)}
.set .sr{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.set .sr:last-child{border:0}
.set .ss{font-size:11px;color:var(--dim);margin-top:2px}
.set input{width:100%;background:rgba(2,6,14,.7);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px;font-size:11px;outline:none;font-family:var(--mono)}
.set input:focus{border-color:var(--blue)}
.set input.n{width:64px;text-align:center;font-size:13px}

/* ===== estrella de favorito ===== */
.star{background:none;border:0;font-size:22px;line-height:1;color:var(--dimmer);cursor:pointer;padding:4px 2px 4px 6px;flex-shrink:0;transition:transform .15s,color .2s}
.star.on{color:var(--gold);text-shadow:0 0 12px rgba(230,184,74,.7)}
.star:active{transform:scale(1.3)}
.card.favc{border-color:rgba(230,184,74,.5);box-shadow:0 0 22px rgba(230,184,74,.16),inset 0 0 30px rgba(230,184,74,.05)}
.card.favc::before{background:linear-gradient(90deg,transparent,rgba(230,184,74,.95),transparent);background-size:60% 100%;background-repeat:no-repeat}
/* ===== barra inferior ===== */
.nav{height:calc(var(--nav-h) + env(safe-area-inset-bottom));gap:2px;padding:8px 6px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:rgba(2,6,14,.94);border-top:1px solid var(--line);flex-shrink:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav .it{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:8px;letter-spacing:.05em;color:var(--dimmer);text-transform:uppercase;padding:6px 2px;border-radius:12px;cursor:pointer;flex:1;min-width:0;border:1px solid transparent;position:relative;overflow:hidden}
.nav .it i{font-style:normal;font-size:18px;line-height:1}
.nav .it.on{color:var(--blue);background:rgba(24,180,255,.1);border-color:rgba(24,180,255,.35);animation:glowp 3s ease-in-out infinite}
.nav .it.on::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(150,225,255,.28) 50%,transparent 62%);background-size:260% 100%;animation:tabsweep 4s ease-in-out infinite;pointer-events:none}
.toast{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(14,26,46,.96);border:1px solid var(--line2);border-radius:12px;padding:10px 18px;font-size:12px;color:var(--text);z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}

/* ---------- utilidades ---------- */
var COLORS = ['#18b4ff', '#2ee6a0', '#e6b84a', '#b48cff', '#00d0f0', '#ff8c42', '#ff5d78', '#7fe0ff', '#9be15d', '#f72585'];

function fmt(n, d) { d = d || 0; var p = Math.abs(n).toFixed(d).split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return p.join(','); }
function money(n, d, plain) { d = d || 0; var neg = n < 0 && Math.abs(n) >= 0.5 * Math.pow(10, -d); return (neg ? '-' : (plain ? '' : '+')) + '$' + fmt(n, d); }

function parseDate(s) {

  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) : null;   /* hora LOCAL, nunca UTC */

/* ---------- identificar la estrategia (N_N_N) ---------- */
function sidOf(s) {
  s = String(s || '').replace(/\[[^\]]*\]\s*$/, '').trim();

  if (m) return m[1] + '_' + m[2] + '_' + m[3];
  var all = s.match(/\d{1,4}_\d{1,4}_\d{1,4}/g);
  return all && all.length ? all[all.length - 1] : null;
}
/* el comentario de MT4 se corta a 31 caracteres: "1_27_5" puede ser 1_27_595 (solo si hay una única opción) */
function resolveSid(sid, known) {
  if (!sid || !known || known[sid]) return sid;
  var p = sid.split('_'), pre = p[0] + '_' + p[1] + '_', c = Object.keys(known).filter(function (k) { return k.indexOf(pre) === 0 && k.slice(pre.length).indexOf(p[2]) === 0; });
  return c.length === 1 ? c[0] : sid;
}
function cleanName(n) { return String(n || '').replace(/\[[^\]]*\]\s*$/, '').replace(/^[^a-zA-Z0-9]*/, '').trim() || String(n || ''); }

/* ---------- parseo de cuenta (EA_Trades_*.csv) ---------- */
function parseAccount(txt, file, src) {
  txt = String(txt).replace(/^﻿/, '');
  var lines = txt.split(/\r?\n/).filter(function (l) { return l.trim(); });
  if (!lines.length) throw new Error('archivo vacío');
  var sep = lines[0].indexOf(';') > -1 ? ';' : ',';
  var acc = { id: file.id, src: src, file: file.name, name: file.name.replace(/^EA_Trades_/i, '').replace(/\.csv$/i, '').replace(/_/g, ' ').trim(), number: '', currency: '', balance: null, equity: null, mt: file.modifiedTime };
  if (lines[0].indexOf('#ACCOUNT') === 0) {
    var p = lines[0].split(sep).map(function (x) { return x.trim(); });
    if (p[1]) acc.name = p[1];
    acc.number = p[2] || ''; acc.currency = p[3] || '';
    /* balance y equity = los dos últimos números de la línea (el símbolo no es numérico) */
    var nums = p.slice(4).map(function (x) { return x.replace(',', '.'); }).filter(function (x) { return x !== '' && !isNaN(+x); }).map(Number);
    if (nums.length >= 2) { acc.balance = nums[nums.length - 2]; acc.equity = nums[nums.length - 1]; }
    else if (nums.length === 1) { acc.balance = nums[0]; }
    lines = lines.slice(1);
  }
  if (!lines.length) { acc.trades = []; return acc; }
  var hdr = lines[0].split(sep).map(normH);
  var ix = function (n) { return hdr.indexOf(n); };
  var I = { ea: ix('ea'), magic: ix('magic'), sym: ix('symbol'), type: ix('type'), open: ix('opentime'), close: ix('closetime'), lots: ix('lots'), pnl: ix('profit'), com: ix('commission'), swap: ix('swap'), cm: ix('comment') };
  if (I.close < 0 || I.pnl < 0) throw new Error('no encuentro CloseTime / Profit en la cabecera');
  var trades = [];
  for (var i = 1; i < lines.length; i++) {
    var c = lines[i].split(sep).map(function (x) { return x.replace(/"/g, '').trim(); });
    if (c.length <= I.pnl) continue;
    var close = parseDate(c[I.close]); if (!close) continue;
    var open = parseDate(c[I.open]) || close;
    var comment = I.cm >= 0 ? (c[I.cm] || '') : '';

    trades.push({ ea: ea, sid: sidOf(ea) || sidOf(comment), magic: c[I.magic] || '', symbol: c[I.sym] || '', type: (c[I.type] || '').toUpperCase(), open: open, close: close, lots: parseFloat(c[I.lots]) || 0, pnl: pnl });
  }
  trades.sort(function (a, b) { return a.close - b.close; });   /* igual que la Library: orden por cierre */
  acc.trades = trades;
  return acc;
}

/* ---------- métricas ---------- */
function maxDD(arr) { var b = 0, pk = 0, dd = 0; for (var i = 0; i < arr.length; i++) { b += arr[i]; if (b > pk) pk = b; if (pk - b > dd) dd = pk - b; } return dd; }
function byMonthOf(trades) { var o = {}; trades.forEach(function (t) { var k = mkey(t.close); o[k] = (o[k] || 0) + t.pnl; }); return o; }
function trailNeg(vals) { var n = 0; for (var i = vals.length - 1; i >= 0; i--) { if (vals[i] < 0) n++; else break; } return n; }
function calc(trades) {
  var p = trades.map(function (t) { return t.pnl; });
  var w = p.filter(function (x) { return x > 0; }), l = p.filter(function (x) { return x <= 0; });
  var net = p.reduce(function (s, v) { return s + v; }, 0);
  var gp = w.reduce(function (s, v) { return s + v; }, 0), gl = Math.abs(l.reduce(function (s, v) { return s + v; }, 0));
  var dd = maxDD(p), bm = byMonthOf(trades), mk = Object.keys(bm).sort();
  var buys = trades.filter(function (t) { return t.type.indexOf('BUY') === 0; }).length, sells = trades.filter(function (t) { return t.type.indexOf('SELL') === 0; }).length;
  return {
    n: p.length, net: net, maxdd: dd, rdd: dd > 0 ? net / dd : 0, wr: p.length ? w.length / p.length : 0, pf: gl > 0 ? gp / gl : (gp > 0 ? Infinity : 0),
    byMonth: bm, buys: buys, sells: sells,
    last: trades.length ? trades[trades.length - 1].close : null,
    curTradeStreak: trailNeg(p), curMonthStreak: trailNeg(mk.map(function (k) { return bm[k]; }))

}
function buildEAs(acc, known) {
  var g = {}, order = [];
  acc.trades.forEach(function (t) {
    var sid = resolveSid(t.sid, known), key = sid || t.ea;
    if (!g[key]) {
      var nm = cleanName(t.ea);
      if (sid) nm = nm.replace(/(\d{1,4})[_ ](\d{1,4})[_ ](\d{1,4})\s*$/, sid);   /* nombre cortado por MT4 -> id completo */
      g[key] = { key: key, sid: sid, name: nm, symbol: t.symbol, raw: [] }; order.push(key);
    }
    g[key].raw.push(t);
  });
  acc.eas = order.map(function (k) { var e = g[k]; var m = calc(e.raw); for (var x in m) e[x] = m[x]; return e; }).sort(function (a, b) { return b.net - a.net; });
  var m = calc(acc.trades); for (var x in m) acc[x] = m[x];
}
function dayPnl(trades, day) { return trades.reduce(function (s, t) { return sameDay(t.close, day) ? s + t.pnl : s; }, 0); }

function dirOf(e) { return e.buys && e.sells ? 'L+C' : e.sells ? 'CORTO' : 'LARGO'; }

/* ---------- SQX históricos ---------- */
function parseSqx(txt) {
  txt = String(txt).replace(/^﻿/, '');
  var lines = txt.split(/\r?\n/).filter(function (l) { return l.trim(); });
  if (lines.length < 2) return null;
  var sep = lines[0].indexOf(';') > -1 ? ';' : ',';
  var hdr = lines[0].split(sep).map(normH);
  var iC = hdr.indexOf('closetime'), iP = hdr.findIndex(function (h) { return h === 'profitloss' || h === 'profit'; });
  if (iC < 0) iC = 6; if (iP < 0) iP = 8;      /* respaldo: columnas clásicas del export de SQX */
  var tr = [];
  for (var i = 1; i < lines.length; i++) {
    var c = lines[i].split(sep).map(function (x) { return x.replace(/"/g, '').trim(); });
    var d = parseDate(c[iC]), p = parseFloat(c[iP]);
    if (!d || isNaN(p)) continue;
    tr.push({ d: d, p: p });
  }
  if (!tr.length) return null;
  tr.sort(function (a, b) { return a.d - b.d; });
  var maxS = 0, cur = 0, all = [];
  tr.forEach(function (t) { if (t.p < 0) { cur++; if (cur > maxS) maxS = cur; } else { if (cur) all.push(cur); cur = 0; } });
  if (cur) all.push(cur);
  var bm = byMonthOf(tr.map(function (t) { return { close: t.d, pnl: t.p }; })), mk = Object.keys(bm).sort(), maxM = 0, cm = 0;
  mk.forEach(function (k) { if (bm[k] < 0) { cm++; if (cm > maxM) maxM = cm; } else cm = 0; });
  return { s: tr.map(function (t) { return [t.d.getTime(), Math.round(t.p * 100) / 100]; }), maxStreak: maxS, avgStreak: all.length ? all.reduce(function (s, v) { return s + v; }, 0) / all.length : 0, maxMonthStreak: maxM, trades: tr.length };
}
/* 2_51_576.csv · 2.51.576.csv · 2_51_576__2025-06-30.csv · 1790003154806_3_6_503.csv */

function authErr() { var e = new Error('Sesión caducada'); e.auth = true; return e; }

}

    var b = best[id];
    if (!b || f.modifiedTime > b.modifiedTime || (f.modifiedTime === b.modifiedTime && f.name > b.name)) best[id] = f;
  });
  var lib = libP ? await libP : D.lib;
  Object.keys(lib.files || {}).forEach(function (id) { if (!best[id]) best[id] = lib.files[id]; });   /* respaldo: el CSV de SQX de la Librería */

}

/* portafolios de FGX Library (portafolios.json en la carpeta FGX LIBRERIA): solo lectura */

/* ---------- Monte Carlo (4 pruebas: orden, saltar, bloques, degradar) ---------- */

}

function libRow(id) {

}
function libFiltered() {

    if (q && id.toLowerCase().indexOf(q) < 0 && String(m.grp).toLowerCase().replace(/\s/g, '_').indexOf(q) < 0 && String(m.asset + '_' + m.tf).toLowerCase().indexOf(q) < 0) return false;
    return true;

}
function libList() {

  var tree = {};
  ids.forEach(function (id) { var m = D.lib.meta[id], a = m.grp || 'Sin clasificar', t = m.tfRaw || m.tf || '—', d = m.dirRaw || m.dir || '—', b = m.bl || 'Sin BL';
    ((((tree[a] = tree[a] || {})[t] = tree[a][t] || {})[d] = tree[a][t][d] || {})[b] = tree[a][t][d][b] || []).push(id); });
  function count(n) { return Array.isArray(n) ? n.length : Object.keys(n).reduce(function (s2, k) { return s2 + count(n[k]); }, 0); }
  function fold(name, n, path, lvl, ic) {
    var op = !!S.libOpen[path];

/* capturas de la Librería (imágenes en Drive), con caché */
var IMGURL = {};
async function imgBlob(fid) {

  try { var r = await dget('https://www.googleapis.com/drive/v3/files/' + fid + '?alt=media&supportsAllDrives=true'); var b = await r.blob(); kvSet('img:' + fid, b); return b; } catch (e) { return null; }

}

  auOpen: function (k) { var i = JSON.parse(k); S.auOpen = S.auOpen === i ? -1 : i; render(); },
  auMC: function (k) { var i = JSON.parse(k), o = S.auRes.res[i]; S.auMC = S.auMC || {}; S.auMC[i] = mcRun(auPnl(o, S.auRes.src), { cap: CAP, limDD: AU.dd }); render(); },
  auSave: function (k) { var i = JSON.parse(k), o = S.auRes.res[i], p = pfCreate('Auto ' + o.ids.length + ' EAs · ' + new Date().toLocaleDateString('es-ES'), o.ids, o.risk, AU.risk, S.auRes.src); p.kind = 'auto'; pfTouch(p); toast('✅ Guardado en Automático'); render(); },
  lpGo: function () { lpRun(); },
  lpStop: function () { LP.stop = true; },
  lpOpen: function (k) { var i = JSON.parse(k); S.lpOpen = S.lpOpen === i ? -1 : i; render(); },
  lpMC: function (k) { var i = JSON.parse(k), o = LP.res.top[i]; S.lpMC = S.lpMC || {}; S.lpMC[i] = mcRun(o.pnl, { cap: CAP, limDD: LP.dd }); render(); },
  lpSave: function (k) { var i = JSON.parse(k), o = LP.res.top[i], risk = {}; o.m.forEach(function (x) { risk[x.id] = x.r; }); var p = pfCreate('Robusto ' + o.m.length + ' EAs · ' + new Date().toLocaleDateString('es-ES'), o.m.map(function (x) { return x.id; }), risk, LP.rmin, o.key === 'bt' ? 'sqx' : 'demo'); p.kind = 'robust'; pfTouch(p); toast('✅ Guardado en Robustos'); render(); },
  pfMC: function () { var t = S.stack[S.stack.length - 1], p = pfBy(t.pid), src = p.src || 'demo', c = pfCalc(p, src); S.pfMC = S.pfMC || {}; S.pfMC[p.id + ':' + src] = mcRun(c.trades.map(function (x) { return x.pnl; }), { cap: CAP, limDD: MCD.limDD }); render(); },
  noop: function () {},
  pfSrc: function (k) { S.pfSrc = JSON.parse(k); render(); },
  pfSrcD: function (k) { var t = S.stack[S.stack.length - 1], p = pfBy(t.pid); if (p) { p.src = JSON.parse(k); pfLocalSave(); render(); } },
  pfNew: function () { var n = pfLive().length + 1, p = { id: 'p' + Date.now().toString(36), name: 'Portafolio ' + n, ids: [], risk: {}, base: 200, src: S.pfSrc, created: Date.now() }; PF.list.push(p); pfTouch(p); push({ t: 'pf', pid: p.id }); },
  pfOpen: function (k) { push({ t: 'pf', pid: JSON.parse(k) }); },
  pfAdd: function () { var t = S.stack[S.stack.length - 1]; S.pick = {}; S.pkF = {}; S.pkQ = ''; push({ t: 'pick', pid: t.pid }); },
  pfRm: function (k) { var t = S.stack[S.stack.length - 1], p = pfBy(t.pid), id = JSON.parse(k); if (p) { p.ids = p.ids.filter(function (x) { return x !== id; }); delete p.risk[id]; pfTouch(p); render(); } },
  pfBaseAll: function () { var t = S.stack[S.stack.length - 1], p = pfBy(t.pid), b = +document.getElementById('pfBase').value; if (p && b > 0) { p.base = b; p.ids.forEach(function (id) { p.risk[id] = b; }); pfTouch(p); render(); } },
  pfSave: function () { var t = S.stack[S.stack.length - 1], p = pfBy(t.pid); if (p) { p.updated = Date.now(); pfLocalSave(); } clearTimeout(PF.timer); pfPush(false); },
  pfDel: function () { var t = S.stack[S.stack.length - 1], p = pfBy(t.pid); if (!p) return; if (S.delArm !== p.id) { S.delArm = p.id; render(); return; } S.delArm = ''; p.deleted = true; pfTouch(p); pop(); },
  pkT: function (k) { var id = JSON.parse(k); S.pick[id] = !S.pick[id]; var t = S.stack[S.stack.length - 1], p = pfBy(t.pid); document.getElementById('pkList').innerHTML = pkList(p); document.getElementById('pkBar').outerHTML = pkBar(); },

  rv: function (k) { S.rachaView = JSON.parse(k); render(); },

document.getElementById('content').addEventListener('click', function (ev) {
  var im0 = ev.target.closest && ev.target.closest('img.cap'); if (im0 && im0.src && im0.getAttribute('src')) { lbOpen(im0.src); return; }
  var t = ev.target.closest('[data-a]'); if (!t || t.disabled) return;
  var f = ACT[t.dataset.a]; if (f) f(t.dataset.k != null ? decodeURIComponent(t.dataset.k) : '', t);
});
document.getElementById('content').addEventListener('input', function (ev) {
  if (ev.target.id === 'pkQ') { S.pkQ = ev.target.value; var t0 = S.stack[S.stack.length - 1], p0 = t0 && pfBy(t0.pid), l0 = document.getElementById('pkList'); if (p0 && l0) l0.innerHTML = pkList(p0); return; } if (ev.target.id === 'libQ') { S.libQ = ev.target.value; var l = document.getElementById('libList'); if (l) l.innerHTML = libList(); } });
document.getElementById('content').addEventListener('change', function (ev) {
  if (ev.target.dataset.cfg) { var ck = ev.target.dataset.cfg; if (ck.indexOf('fd.') === 0 || ck.indexOf('fa.') === 0) fdApply(ck, ev.target.value); else { cfgApply(ck, ev.target.value); if (ck === 'cap') { FD.res = null; fdSave(); } } render(); return; }
  if (ev.target.id === 'fdSel') { FD.pid = ev.target.value; FD.risk = {}; FD.res = null; render(); return; }
  if (ev.target.dataset.fr) { var rv = +String(ev.target.value).replace(',', '.'); if (rv > 0) { FD.risk[ev.target.dataset.fr] = rv; FD.res = null; } render(); return; }
  var t0 = S.stack[S.stack.length - 1], p0 = t0 && t0.t === 'pf' ? pfBy(t0.pid) : null;
  if (p0 && p0.ro) { render(); return; }
  if (p0 && ev.target.dataset.rk) { var v = +String(ev.target.value).replace(',', '.'); if (v > 0) { p0.risk[ev.target.dataset.rk] = v; pfTouch(p0); } render(); return; }
  if (p0 && ev.target.id === 'pfName') { p0.name = ev.target.value.trim() || p0.name; pfTouch(p0); render(); return; }
  if (p0 && ev.target.id === 'pfBase') { var b = +String(ev.target.value).replace(',', '.'); if (b > 0) { p0.base = b; pfTouch(p0); } return; }
  if (ev.target.id === 'alertIn') { ALERT_DAYS = Math.min(90, Math.max(1, parseInt(ev.target.value) || 7)); lsSet('tm_alert_days', ALERT_DAYS); toast('✅ ' + ALERT_DAYS + ' días'); }
});
document.getElementById('nav').addEventListener('click', function (ev) { var t = ev.target.closest('.it'); if (t) goTab(t.dataset.tab); });
document.getElementById('refreshBtn').addEventListener('click', refresh);
document.getElementById('live').addEventListener('click', function () { if (S.live === 'off' || S.live === 'cache') connect(); else refresh(); });
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && tokenOk() && !S.loading && D.updated && Date.now() - D.updated.getTime() > 5 * 60000) loadAll(false);
});

(async function boot() {
  history.replaceState({ d: 0 }, '');
  idb = await idbOpen();
  setLive('load'); showLoading('Iniciando…');
  if (tokenOk()) await loadAll(false);
  else { await loadAll(true); if (!(D.vps.length || D.demo.length)) { setLive('off'); render(); } }
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
