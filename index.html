<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trading Monitor</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#2d333b;
  --border:#30363d;--text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --green:#3fb950;--red:#f85149;--gold:#e3b341;--accent:#58a6ff;
  --purple:#bc8cff;--nav-h:65px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{padding:12px 16px 10px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:22px;font-weight:700}
.header-sub{font-size:11px;color:var(--text3);margin-top:2px}
.refresh-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2);padding:6px 10px;font-size:13px;cursor:pointer}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.nav{height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);display:flex;flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:8px 0}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:10px;color:var(--text3);font-weight:500}
.nav-item.active .nav-label{color:var(--accent)}
/* CARDS */
.day-card{background:var(--bg2);border:1px solid rgba(63,185,80,.3);border-radius:16px;padding:16px;margin-bottom:12px;text-align:center}
.day-card-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.day-card-val{font-size:32px;font-weight:700;font-family:var(--mono)}
.day-card-date{font-size:11px;color:var(--text3);margin-top:4px}
.summary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.stat-val{font-size:15px;font-weight:700;font-family:var(--mono)}
.acc-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden;cursor:pointer}
.acc-card:active{opacity:.8}
.acc-stripe{position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px}
.acc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.acc-name{font-size:15px;font-weight:700}
.acc-sub{font-size:11px;color:var(--text3);margin-top:2px}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--bg3);border-radius:10px;padding:9px 10px}
.metric-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.metric-val{font-size:14px;font-weight:700;font-family:var(--mono)}
/* MONTH */
.month-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.month-hdr{padding:11px 14px;background:var(--bg3);display:flex;justify-content:space-between;align-items:center}
.month-hdr-name{font-size:13px;font-weight:700}
.month-rows{padding:6px 8px}
.month-row{display:flex;justify-content:space-between;align-items:center;padding:7px 6px;border-radius:8px}
/* RANKING */
.rank-filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.rank-filter-btn{white-space:nowrap;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;font-family:var(--font)}
.rank-filter-btn.active{border-color:var(--accent);background:rgba(88,166,255,.15);color:var(--accent)}
.rank-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:8px}
.rank-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rank-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.r1{background:#f0c000;color:#000}.r2{background:#9ba3a6;color:#000}.r3{background:#cd7f32;color:#fff}.rn{background:var(--bg3);color:var(--text3)}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-sym{display:inline-block;font-size:9px;color:var(--accent);font-family:var(--mono);background:var(--bg3);padding:1px 5px;border-radius:3px;margin-top:2px}
.rank-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rank-m{text-align:center;background:var(--bg3);border-radius:8px;padding:6px}
.rank-m .l{font-size:8px;color:var(--text3);text-transform:uppercase;margin-bottom:2px}
.rank-m .v{font-size:12px;font-weight:700;font-family:var(--mono)}
/* SETTINGS */
.settings-section{background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}
.settings-title{padding:11px 14px;background:var(--bg3);font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border)}
.settings-row{padding:12px 14px;border-bottom:1px solid rgba(48,54,61,.5);display:flex;align-items:center;justify-content:space-between}
.settings-row:last-child{border:none}
.settings-lbl{font-size:13px;color:var(--text)}
.settings-sub{font-size:11px;color:var(--text3);margin-top:2px}
.btn-primary{width:100%;background:var(--accent);color:#0d1117;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);margin-bottom:8px}
.btn-secondary{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:10px;padding:13px;font-size:14px;cursor:pointer;font-family:var(--font);margin-bottom:8px}
.btn-back{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2);padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--font)}
/* MISC */
.pos{color:var(--green)}.neg{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--accent)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--text3)}
.empty{text-align:center;padding:50px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:12px;line-height:1.5}
.toast{position:fixed;bottom:calc(var(--nav-h) + 10px);left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:12px;color:var(--text);z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-row">
      <div><h1 id="pageTitle">Trading Monitor</h1><div class="header-sub" id="lastUpdate">Conecta Google Drive para empezar</div></div>
      <button class="refresh-btn" id="refreshBtn">🔄</button>
    </div>
  </div>
  <div class="content" id="content">
    <div class="empty"><div class="empty-icon">📊</div><div class="empty-title">Trading Monitor</div><div class="empty-sub">Ve a ⚙️ Ajustes y conecta con Google Drive</div></div>
  </div>
  <div class="nav">
    <div class="nav-item active" id="nav-cuentas"><div class="nav-icon">🏦</div><div class="nav-label">Cuentas</div></div>
    <div class="nav-item" id="nav-resumen"><div class="nav-icon">📊</div><div class="nav-label">Resumen</div></div>
    <div class="nav-item" id="nav-ranking"><div class="nav-icon">🏆</div><div class="nav-label">Ranking</div></div>
    <div class="nav-item" id="nav-ajustes"><div class="nav-icon">⚙️</div><div class="nav-label">Ajustes</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──
var CLIENT_ID   = '40558411875-ga9v8q1ado8g37fd3r1abbj79p41ervh.apps.googleusercontent.com';
var SCOPES      = 'https://www.googleapis.com/auth/drive.readonly';
var FOLDER_ID   = localStorage.getItem('tm_folder_id')   || '14v9ZVOKdgEXjOOto1XvmJxBl7Nq8ewUP';
var FOLDER_NAME = localStorage.getItem('tm_folder_name') || 'Csv sistemas app monitor';
var ALERT_DAYS  = parseInt(localStorage.getItem('tm_alert_days')) || 7;
var accessToken = localStorage.getItem('tm_token') || null;

var accounts   = {};
var currentTab = 'cuentas';
var rankFilter = 'global';
var tokenClient = null;
var accentColors = ['#3fb950','#58a6ff','#e3b341','#bc8cff','#f85149','#48cae4','#d29922','#ff8c42','#00f5c4','#f72585'];

// ── NAV ──
document.querySelectorAll('.nav-item').forEach(function(el){
  el.addEventListener('click', function(){
    var tab = el.id.replace('nav-','');
    document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
    el.classList.add('active');
    currentTab = tab;
    var titles = {cuentas:'Trading Monitor',resumen:'Resumen Mensual',ranking:'Ranking EAs',ajustes:'Ajustes'};
    document.getElementById('pageTitle').textContent = titles[tab] || 'Trading Monitor';
    renderTab(tab);
  });
});

document.getElementById('refreshBtn').addEventListener('click', function(){ refreshData(); });

// ── INIT ──
window.onload = function(){
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = function(){
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: function(resp){
        if(resp.error){ showToast('Error: '+resp.error); return; }
        accessToken = resp.access_token;
        localStorage.setItem('tm_token', accessToken);
        showToast('✅ Conectado');
        loadCSVs();
      }
    });
    // Only auto-load if we have token saved - NO auto popup
    if(FOLDER_ID && accessToken) loadCSVs();
  };
  document.head.appendChild(s);
};

// ── CONNECT ──
function connectDrive(){
  if(!tokenClient){ showToast('Cargando...'); return; }
  tokenClient.requestAccessToken();
}

// ── LOAD DATA ──
async function loadCSVs(){
  if(!accessToken){ showToast('Conecta Google Drive primero'); return; }
  showLoading('Cargando cuentas...');
  try{
    var url = 'https://www.googleapis.com/drive/v3/files?'
      + 'q=' + encodeURIComponent("'"+FOLDER_ID+"' in parents and name contains 'EA_Trades_' and trashed=false")
      + '&fields=files(id,name,modifiedTime,mimeType)&pageSize=50';
    var resp = await fetch(url, {headers:{Authorization:'Bearer '+accessToken}});
    if(resp.status===401){
      accessToken=null; localStorage.removeItem('tm_token');
      showEmpty('Sesión expirada','Ve a ⚙️ Ajustes → Reconectar');
      return;
    }
    var data = await resp.json();
    var files = data.files||[];
    if(!files.length){ showEmpty('Sin archivos CSV','El EA Exporter aún no ha exportado o la carpeta está vacía'); return; }
    accounts={};
    for(var i=0;i<files.length;i++){
      var txt = await fetchFile(files[i].id);
      var acc = parseCSV(txt, files[i].name, i, files[i].modifiedTime);
      if(acc) accounts[acc.name]=acc;
    }
    document.getElementById('lastUpdate').textContent='Actualizado '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
    renderTab(currentTab);
    showToast('✅ '+Object.keys(accounts).length+' cuentas');
  }catch(e){ showToast('❌ '+e.message); showEmpty('Error',''+e.message); }
}

async function fetchFile(id){
  var r = await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{headers:{Authorization:'Bearer '+accessToken}});
  return r.text();
}

function refreshData(){ if(accessToken&&FOLDER_ID) loadCSVs(); else showToast('Conecta Google Drive primero'); }

// ── PARSE ──
function parseCSV(txt, filename, idx, modTime){
  var lines = txt.split(/\r?\n/).filter(function(l){return l.trim();});
  if(!lines.length) return null;
  var sep = lines[0].indexOf(';')>-1?';':',';
  var name = filename.replace(/^EA_Trades_/i,'').replace(/\.csv$/i,'').replace(/_/g,' ').trim();
  if(lines[0].startsWith('#ACCOUNT')){
    var p=lines[0].split(sep); if(p[1]) name=p[1].trim(); lines=lines.slice(1);
  }
  var iEA=1,iMagic=2,iSymbol=3,iType=4,iOpenT=5,iCloseT=6,iPnl=10,iComm=11,iSwap=12;
  var trades=[];
  for(var i=1;i<lines.length;i++){
    var c=lines[i].split(sep).map(function(x){return x.replace(/"/g,'').trim();});
    if(c.length<10) continue;
    try{
      var pnl=(parseFloat(c[iPnl])||0)+(parseFloat(c[iComm])||0)+(parseFloat(c[iSwap])||0);
      var cd=parseDate(c[iCloseT]), od=parseDate(c[iOpenT]);
      if(!cd) continue;
      trades.push({ea:c[iEA]||'EA',magic:c[iMagic],symbol:c[iSymbol],type:c[iType],pnl:pnl,open:od||cd,close:cd});
    }catch(e){}
  }
  if(!trades.length) return null;
  var byEA={};
  trades.forEach(function(t){
    if(!byEA[t.ea]) byEA[t.ea]={name:t.ea,symbol:t.symbol,trades:[]};
    byEA[t.ea].trades.push(t);
  });
  var eas=Object.values(byEA).map(calcEA).sort(function(a,b){return b.net-a.net;});
  var profits=trades.map(function(t){return t.pnl;});
  var net=profits.reduce(function(s,v){return s+v;},0);
  var bal=0,pk=0,maxdd=0;
  profits.forEach(function(p){bal+=p;if(bal>pk)pk=bal;var d=pk-bal;if(d>maxdd)maxdd=d;});
  var wins=profits.filter(function(p){return p>0;});
  var wr=profits.length?wins.length/profits.length:0;
  var byMonth={};
  trades.forEach(function(t){
    var mk=t.close.getFullYear()+'-'+String(t.close.getMonth()+1).padStart(2,'0');
    byMonth[mk]=(byMonth[mk]||0)+t.pnl;
  });
  var today=new Date(); var todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var dayPnl=trades.filter(function(t){
    var ds=t.close.getFullYear()+'-'+String(t.close.getMonth()+1).padStart(2,'0')+'-'+String(t.close.getDate()).padStart(2,'0');
    return ds===todayStr;
  }).reduce(function(s,t){return s+t.pnl;},0);
  return{name:name,filename:filename,color:accentColors[idx%accentColors.length],trades:trades,eas:eas,net:net,maxdd:maxdd,rdd:maxdd>0?net/maxdd:0,wr:wr,totalTrades:trades.length,byMonth:byMonth,dayPnl:dayPnl,modifiedTime:modTime};
}

function parseDate(s){
  if(!s) return null;
  var d=new Date(s.replace(/\./g,'-').replace(' ','T')+(s.length<=16?':00':''));
  return isNaN(d)?null:d;
}

function calcEA(ea){
  var p=ea.trades.map(function(t){return t.pnl;});
  var w=p.filter(function(x){return x>0;}), l=p.filter(function(x){return x<=0;});
  var net=p.reduce(function(s,v){return s+v;},0);
  var gp=w.reduce(function(s,v){return s+v;},0), gl=Math.abs(l.reduce(function(s,v){return s+v;},0));
  var wr=p.length?w.length/p.length:0, pf=gl>0?gp/gl:999;
  var bal=0,pk=0,maxdd=0;
  p.forEach(function(x){bal+=x;if(bal>pk)pk=bal;var d=pk-bal;if(d>maxdd)maxdd=d;});
  var rdd=maxdd>0?net/maxdd:0;
  var last=ea.trades[ea.trades.length-1].close;
  var daysSince=Math.floor((new Date()-last)/86400000);
  var byMonth={};
  ea.trades.forEach(function(t){var mk=t.close.getFullYear()+'-'+String(t.close.getMonth()+1).padStart(2,'0');byMonth[mk]=(byMonth[mk]||0)+t.pnl;});
  return{name:ea.name,symbol:ea.symbol,trades:p.length,net:net,maxdd:maxdd,rdd:rdd,wr:wr,pf:pf,byMonth:byMonth,daysSince:daysSince,lastTrade:last};
}

// ── RENDER TABS ──
function renderTab(tab){
  if(tab==='cuentas')  renderCuentas();
  if(tab==='resumen')  renderResumen();
  if(tab==='ranking')  renderRanking();
  if(tab==='ajustes')  renderAjustes();
}

// ── CUENTAS ──
function renderCuentas(){
  var accs=Object.values(accounts);
  if(!accs.length){ showEmpty('Sin cuentas','Conecta Google Drive en ⚙️ Ajustes'); return; }
  var totalNet=accs.reduce(function(s,a){return s+a.net;},0);
  var totalDay=accs.reduce(function(s,a){return s+a.dayPnl;},0);
  var html='';
  // Big day card
  html+='<div class="day-card" style="border-color:'+(totalDay>=0?'rgba(63,185,80,.3)':'rgba(248,81,73,.3)') +'">'
    +'<div class="day-card-lbl">P&L Total Hoy</div>'
    +'<div class="day-card-val '+(totalDay>=0?'pos':'neg')+'">'+(totalDay>=0?'+':'')+' $'+totalDay.toFixed(2)+'</div>'
    +'<div class="day-card-date">'+new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+'</div>'
    +'</div>';
  // Stats
  html+='<div class="summary-stats">';
  html+=sCard('Cuentas',accs.length,'var(--accent)');
  html+=sCard('Net Total',(totalNet>=0?'+':'')+' $'+Math.round(totalNet),totalNet>=0?'var(--green)':'var(--red)');
  html+=sCard('EAs',accs.reduce(function(s,a){return s+a.eas.length;},0),'var(--purple)');
  html+='</div>';
  // Account cards
  accs.forEach(function(acc,i){
    html+='<div class="acc-card" data-acc="'+i+'" style="cursor:pointer">'
      +'<div class="acc-stripe" style="background:'+acc.color+'"></div>'
      +'<div class="acc-top">'
        +'<div><div class="acc-name">'+acc.name+'</div>'
        +'<div class="acc-sub">'+acc.eas.length+' EAs · '+acc.totalTrades+' trades</div></div>'
        +'<div style="text-align:right">'
          +'<div style="font-size:10px;color:var(--text3)">Hoy</div>'
          +'<div style="font-size:16px;font-weight:700;font-family:var(--mono);color:'+(acc.dayPnl>=0?'var(--green)':'var(--red)')+'">'+(acc.dayPnl>=0?'+':'')+acc.dayPnl.toFixed(0)+'</div>'
        +'</div>'
      +'</div>'
      +'<div class="metrics-grid">'
        +mBox('Net P&L',(acc.net>=0?'+':'')+' $'+Math.round(acc.net),acc.net>=0?'var(--green)':'var(--red)')
        +mBox('Max DD','$'+Math.round(acc.maxdd),'var(--red)')
        +mBox('Ret/DD',acc.rdd.toFixed(2),'var(--gold)')
        +mBox('Win Rate',(acc.wr*100).toFixed(1)+'%',acc.wr>=0.5?'var(--green)':'var(--red)')
      +'</div>'
      +'</div>';
  });
  document.getElementById('content').innerHTML=html;
  // Add click handlers
  document.querySelectorAll('.acc-card[data-acc]').forEach(function(el){
    el.addEventListener('click', function(){
      var idx=parseInt(el.dataset.acc);
      var acc=Object.values(accounts)[idx];
      if(acc) showAccDetail(acc);
    });
  });
}

// ── ACCOUNT DETAIL ──
function showAccDetail(acc){
  var html='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">'
    +'<button class="btn-back" id="backBtn">← Volver</button>'
    +'<div style="width:12px;height:12px;border-radius:50%;background:'+acc.color+'"></div>'
    +'<div style="font-size:18px;font-weight:700">'+acc.name+'</div>'
    +'</div>';
  html+='<div class="metrics-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">'
    +mBox('Net P&L',(acc.net>=0?'+':'')+' $'+Math.round(acc.net),acc.net>=0?'var(--green)':'var(--red)')
    +mBox('P&L Hoy',(acc.dayPnl>=0?'+':'')+' $'+acc.dayPnl.toFixed(2),acc.dayPnl>=0?'var(--green)':'var(--red)')
    +mBox('Max DD','$'+Math.round(acc.maxdd),'var(--red)')
    +mBox('Ret/DD',acc.rdd.toFixed(2),'var(--gold)')
    +mBox('Win Rate',(acc.wr*100).toFixed(1)+'%',acc.wr>=0.5?'var(--green)':'var(--red)')
    +mBox('EAs',acc.eas.length,'var(--accent)')
    +'</div>';
  html+='<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px">'
    +'<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">📈 Equity</div>'
    +'<canvas id="eqChart" height="130"></canvas>'
    +'</div>';
  html+='<div style="font-size:12px;font-weight:700;margin-bottom:8px">🏆 EAs</div>';
  acc.eas.forEach(function(e,i){
    var rc=i===0?'r1':i===1?'r2':i===2?'r3':'rn';
    html+='<div class="rank-card">'
      +'<div class="rank-hdr">'
        +'<div class="rank-num '+rc+'">'+(i+1)+'</div>'
        +'<div class="rank-info"><div class="rank-name">'+e.name+'</div><span class="rank-sym">'+(e.symbol||'—')+'</span></div>'
        +'<div class="'+(e.net>=0?'pos':'neg')+'" style="font-size:14px;font-weight:700;font-family:var(--mono)">'+(e.net>=0?'+':'')+' $'+Math.round(e.net)+'</div>'
      +'</div>'
      +'<div class="rank-metrics">'
        +'<div class="rank-m"><div class="l">Trades</div><div class="v blue">'+e.trades+'</div></div>'
        +'<div class="rank-m"><div class="l">Win Rate</div><div class="v '+(e.wr>=0.5?'pos':'neg')+'">'+(e.wr*100).toFixed(0)+'%</div></div>'
        +'<div class="rank-m"><div class="l">Ret/DD</div><div class="v gold">'+e.rdd.toFixed(2)+'</div></div>'
      +'</div>'
      +'</div>';
  });
  document.getElementById('content').innerHTML=html;
  document.getElementById('backBtn').addEventListener('click', function(){ renderCuentas(); });
  // Draw chart
  setTimeout(function(){
    var ctx=document.getElementById('eqChart'); if(!ctx) return;
    var sorted=[...acc.trades].sort(function(a,b){return a.close-b.close;});
    var eq=[0]; sorted.forEach(function(t){eq.push(eq[eq.length-1]+t.pnl);});
    if(window._eq) window._eq.destroy();
    window._eq=new Chart(ctx,{
      type:'line',
      data:{labels:eq.map(function(_,i){return i;}),datasets:[{data:eq,borderColor:acc.color,backgroundColor:acc.color+'20',borderWidth:2,pointRadius:0,fill:true,tension:0.3}]},
      options:{plugins:{legend:{display:false}},scales:{x:{display:false},y:{ticks:{color:'#6e7681',callback:function(v){return'$'+Math.round(v);}},grid:{color:'rgba(48,54,61,.4)'}}},animation:{duration:300}}
    });
  },50);
}

// ── RESUMEN ──
function renderResumen(){
  var accs=Object.values(accounts);
  if(!accs.length){ showEmpty('Sin datos','Conecta Google Drive en ⚙️ Ajustes'); return; }
  var mNames=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var html='';
  accs.forEach(function(acc){
    var months=Object.keys(acc.byMonth).sort().slice(-12);
    var total=Object.values(acc.byMonth).reduce(function(s,v){return s+v;},0);
    html+='<div class="month-card">'
      +'<div class="month-hdr">'
        +'<div style="display:flex;align-items:center;gap:8px"><div style="width:10px;height:10px;border-radius:50%;background:'+acc.color+'"></div><span class="month-hdr-name">'+acc.name+'</span></div>'
        +'<span style="font-size:13px;font-weight:700;font-family:var(--mono);color:'+(total>=0?'var(--green)':'var(--red)')+'">'+(total>=0?'+':'')+' $'+Math.round(total)+'</span>'
      +'</div><div class="month-rows">';
    months.slice().reverse().forEach(function(m){
      var v=acc.byMonth[m], p=m.split('-');
      var lbl=mNames[parseInt(p[1])-1]+' '+p[0].slice(2);
      html+='<div class="month-row"><span style="font-size:12px;color:var(--text2)">'+lbl+'</span>'
        +'<span style="font-size:12px;font-weight:700;font-family:var(--mono);color:'+(v>=0?'var(--green)':'var(--red)')+'">'+(v>=0?'+':'')+' $'+Math.round(v)+'</span></div>';
    });
    html+='</div></div>';
  });
  document.getElementById('content').innerHTML=html;
}

// ── RANKING ──
function renderRanking(){
  var accs=Object.values(accounts);
  if(!accs.length){ showEmpty('Sin datos','Conecta Google Drive en ⚙️ Ajustes'); return; }
  var curMonth=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  var html='<div class="rank-filters" id="rankFilters">'
    +'<button class="rank-filter-btn'+(rankFilter==='global'?' active':'')+'" data-filter="global">🌐 Global</button>';
  accs.forEach(function(acc){ html+='<button class="rank-filter-btn'+(rankFilter===acc.name?' active':'')+'" data-filter="'+acc.name+'">'+acc.name+'</button>'; });
  html+='</div>';
  var allEAs=[];
  accs.forEach(function(acc){ if(rankFilter==='global'||rankFilter===acc.name) acc.eas.forEach(function(e){ allEAs.push(Object.assign({},e,{account:acc.name,accountColor:acc.color})); }); });
  allEAs.sort(function(a,b){return b.net-a.net;});
  html+='<div style="font-size:11px;color:var(--text3);margin-bottom:10px">'+allEAs.length+' EAs</div>';
  allEAs.forEach(function(e,i){
    var rc=i===0?'r1':i===1?'r2':i===2?'r3':'rn';
    var mp=e.byMonth[curMonth]||0;
    html+='<div class="rank-card">'
      +'<div class="rank-hdr">'
        +'<div class="rank-num '+rc+'">'+(i+1)+'</div>'
        +'<div class="rank-info"><div class="rank-name">'+e.name+'</div>'
          +'<div style="display:flex;gap:4px;align-items:center;margin-top:2px"><span class="rank-sym">'+(e.symbol||'—')+'</span>'
          +(rankFilter==='global'?'<span style="font-size:9px;color:var(--text3)">· '+e.account+'</span>':'')+'</div>'
        +'</div>'
        +'<div style="text-align:right"><div style="font-size:14px;font-weight:700;font-family:var(--mono);color:'+(e.net>=0?'var(--green)':'var(--red)')+'">'+(e.net>=0?'+':'')+' $'+Math.round(e.net)+'</div>'
          +'<div style="font-size:10px;color:var(--text3)">Mes: '+(mp>=0?'+':'')+' $'+Math.round(mp)+'</div>'
        +'</div>'
      +'</div>'
      +'<div class="rank-metrics">'
        +'<div class="rank-m"><div class="l">Trades</div><div class="v blue">'+e.trades+'</div></div>'
        +'<div class="rank-m"><div class="l">Win Rate</div><div class="v '+(e.wr>=0.5?'pos':'neg')+'">'+(e.wr*100).toFixed(0)+'%</div></div>'
        +'<div class="rank-m"><div class="l">Ret/DD</div><div class="v gold">'+e.rdd.toFixed(2)+'</div></div>'
      +'</div>'
      +'</div>';
  });
  document.getElementById('content').innerHTML=html;
  // Filter buttons
  document.querySelectorAll('.rank-filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ rankFilter=btn.dataset.filter; renderRanking(); });
  });
}

// ── AJUSTES ──
function renderAjustes(){
  var connected=!!accessToken;
  var html='<div class="settings-section"><div class="settings-title">Google Drive</div>'
    +'<div class="settings-row"><div><div class="settings-lbl">Estado</div><div class="settings-sub">'+(connected?'Conectado':'No conectado')+'</div></div><div>'+(connected?'✅':'❌')+'</div></div>'
    +'<div class="settings-row"><div><div class="settings-lbl">Carpeta CSV</div><div class="settings-sub">'+(FOLDER_NAME||'Sin configurar')+'</div></div></div>'
    +'</div>';
  html+='<button class="btn-primary" id="connectBtn">'+(connected?'🔄 Reconectar':'🔗 Conectar con Google Drive')+'</button>';
  if(connected){
    html+='<div class="settings-section"><div class="settings-title">ID de carpeta Drive</div>'
      +'<div class="settings-row"><input id="folderIdInput" type="text" value="'+FOLDER_ID+'" placeholder="ID de carpeta" style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px;font-size:11px;outline:none;font-family:monospace"></div>'
      +'</div>';
    html+='<button class="btn-secondary" id="saveFolderBtn">💾 Guardar carpeta</button>';
  }
  html+='<div class="settings-section"><div class="settings-title">Alertas</div>'
    +'<div class="settings-row"><div><div class="settings-lbl">Días sin operar</div></div>'
    +'<input type="number" id="alertInput" value="'+ALERT_DAYS+'" min="1" max="90" style="width:60px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 8px;font-size:13px;text-align:center;outline:none">'
    +'</div></div>';
  if(Object.keys(accounts).length) html+='<button class="btn-secondary" id="refreshBtn2">🔄 Actualizar datos</button>';
  document.getElementById('content').innerHTML=html;
  // Listeners
  document.getElementById('connectBtn').addEventListener('click', connectDrive);
  if(connected && document.getElementById('saveFolderBtn')){
    document.getElementById('saveFolderBtn').addEventListener('click', function(){
      var id=document.getElementById('folderIdInput').value.trim();
      if(!id) return;
      FOLDER_ID=id; FOLDER_NAME='Csv sistemas app monitor';
      localStorage.setItem('tm_folder_id',FOLDER_ID);
      localStorage.setItem('tm_folder_name',FOLDER_NAME);
      showToast('✅ Guardado');
      loadCSVs();
    });
  }
  if(document.getElementById('alertInput')){
    document.getElementById('alertInput').addEventListener('change', function(){
      ALERT_DAYS=parseInt(this.value)||7;
      localStorage.setItem('tm_alert_days',ALERT_DAYS);
    });
  }
  if(document.getElementById('refreshBtn2')){
    document.getElementById('refreshBtn2').addEventListener('click', refreshData);
  }
}

// ── HELPERS ──
function mBox(lbl,val,clr){ return'<div class="metric"><div class="metric-lbl">'+lbl+'</div><div class="metric-val" style="color:'+clr+'">'+val+'</div></div>'; }
function sCard(lbl,val,clr){ return'<div class="stat-card"><div class="stat-lbl">'+lbl+'</div><div class="stat-val" style="color:'+clr+'">'+val+'</div></div>'; }
function showLoading(msg){ document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div><div class="loading-txt">'+(msg||'Cargando...')+'</div></div>'; }
function showEmpty(t,s){ document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">📂</div><div class="empty-title">'+t+'</div><div class="empty-sub">'+s+'</div></div>'; }
function showToast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },3000); }
</script>
</body>
